<div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">

  <form class="space-y-4">

    <!-- Full Name -->
    <div>
      <label class="block text-gray-700 font-medium mb-1">Full Name</label>
      <input
        type="text"
        name="fullName"
        required
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1F7A8C]"
      >
    </div>

    <!-- Email -->
    <div>
      <label class="block text-gray-700 font-medium mb-1">Email</label>
      <input
        type="email"
        name="email"
        required
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1F7A8C]"
      >
    </div>

    <!-- Phone -->
    <div>
      <label class="block text-gray-700 font-medium mb-1">Phone</label>
      <input
        type="tel"
        name="phone"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1F7A8C]"
      >
    </div>

    <!-- Password -->
    <div>
      <label class="block text-gray-700 font-medium mb-1">Change Password</label>
      <input
        type="password"
        name="password"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1F7A8C]"
      >
    </div>

    <!-- Submit Button -->
    <div class="pt-4">
      <button
        type="submit"
        class="bg-[#1F7A8C] hover:bg-[#166e7f] text-white font-semibold px-6 py-2 rounded-lg transition"
      >
        Update Profile
      </button>
    </div>

  </form>
</div>
