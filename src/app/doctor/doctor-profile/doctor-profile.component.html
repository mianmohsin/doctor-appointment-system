<header class="flex justify-between items-center mb-6">
  <div>
    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">My Profile</h1>
  </div>
</header>
<div class="flex gap-5">
  <div class="w-full">
    <div class="bg-white rounded-[3rem] shadow-sm border border-slate-100 p-10">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-[12px] font-black uppercase tracking-widest text-slate-400 ml-1 mb-2 block">
            Full Name</label>
          <input type="text" placeholder=""
            class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-emerald-500/20 transition-all">
        </div>
        <div>
          <label class="text-[12px] font-black uppercase tracking-widest text-slate-400 ml-1 mb-2 block">Date of Birth</label>
          <input type="date" placeholder=""
            class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-emerald-500/20 transition-all">
        </div>
        <div>
          <label class="text-[12px] font-black uppercase tracking-widest text-slate-400 ml-1 mb-2 block">
            Email</label>
          <input type="email" placeholder=""
            class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-emerald-500/20 transition-all">
        </div>
        <div>
          <label class="text-[12px] font-black uppercase tracking-widest text-slate-400 ml-1 mb-2 block">
            Phone</label>
          <input type="phone" placeholder=""
            class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-emerald-500/20 transition-all">
        </div>
        <div>
          <label class="text-[12px] font-black uppercase tracking-widest text-slate-400 ml-1 mb-2 block">
            Qualification</label>
          <input type="text" placeholder=""
            class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-emerald-500/20 transition-all">
        </div>
        <div>
          <label class="text-[12px] font-black uppercase tracking-widest text-slate-400 ml-1 mb-2 block">
            Specialzation</label>
          <input type="text" placeholder=""
            class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-emerald-500/20 transition-all">
        </div>
        <div>
          <label class="text-[12px] font-black uppercase tracking-widest text-slate-400 ml-1 mb-2 block">
            Experience</label>
          <input type="number" placeholder=""
            class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-emerald-500/20 transition-all">
        </div>
        <div>
          <label class="text-[12px] font-black uppercase tracking-widest text-slate-400 ml-1 mb-2 block">
            Change Password</label>
          <input type="phone" placeholder=""
            class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-emerald-500/20 transition-all">
        </div>
        <div class="col-span-2">
          <label class="text-[12px] font-black uppercase tracking-widest text-slate-400 ml-1 mb-2 block">Biography</label>
          <textarea rows="3" placeholder=""
            class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl text-sm font-medium focus:ring-2 focus:ring-emerald-500/20 transition-all resize-none"></textarea>
        </div>

        <button type="submit"
          class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-bold text-sm shadow-xl shadow-emerald-500/20 transition-all flex items-center justify-center gap-3">
          <i class="material-icons">check</i> Update Profile
        </button>
      </div>
    </div>
  </div>
</div>
