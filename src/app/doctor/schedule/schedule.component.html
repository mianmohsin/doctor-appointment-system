<header class="flex justify-between items-center mb-6">
  <div>
    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Schedule</h1>
  </div>
  <button (click)="openSidebar()"
    class="bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold text-sm shadow-xl shadow-slate-900/20 hover:bg-slate-800 transition-all flex items-center gap-2">
    <i class="fa-solid fa-plus"></i> Create Schedule
  </button>
</header>
<div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
  <table class="w-full text-left border-collapse">
    <thead>
      <tr class="bg-slate-100">
        <th class="px-8 py-6 text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400">Mon</th>
        <th class="px-8 py-6 text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400">Tue</th>
        <th class="px-8 py-6 text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400">Wed</th>
        <th class="px-8 py-6 text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400">Thu</th>
        <th class="px-8 py-6 text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400">Fri</th>
        <th class="px-8 py-6 text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400">Sat</th>
        <th class="px-8 py-6 text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400">Sun</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-50">
      <!-- Row 1 -->
      <tr class="hover:bg-slate-50/80 transition-colors group text-[13px]">
        <td class="px-8 py-5">
          09:00
        </td>
        <td class="px-8 py-5">Booked</td>
        <td class="px-8 py-5">Avail</td>
        <td class="px-8 py-5">Surgery</td>
        <td class="px-8 py-5">Personal</td>
        <td class="px-8 py-5">----------</td>
        <td class="px-8 py-5">----------</td>
      </tr>
    </tbody>
  </table>
  <!-- Overlay -->
  <div *ngIf="isSidebarOpen" class="fixed inset-0 bg-black/30 z-40"></div>

  <!-- Sidebar -->
  <div class="fixed top-0 right-0 h-full w-[400px] bg-white shadow-2xl z-50 transform transition-transform duration-300"
    [ngClass]="{'translate-x-0': isSidebarOpen, 'translate-x-full': !isSidebarOpen}">

    <!-- Header -->
    <div class="flex justify-between items-center p-6 border-b">
      <h2 class="text-lg font-bold text-slate-800">Create Schedule</h2>
      <button (click)="closeSidebar()">
        <span class="material-icons">close</span>
      </button>
    </div>

    <!-- Overlay -->
    <div *ngIf="isSidebarOpen" class="fixed inset-0 bg-black/30 z-40"></div>

    <!-- Sidebar -->
    <div
      class="fixed top-0 right-0 h-full w-[400px] bg-white shadow-2xl z-50 transform transition-transform duration-300"
      [ngClass]="{'translate-x-0': isSidebarOpen, 'translate-x-full': !isSidebarOpen}">

      <!-- Header -->
      <div class="flex justify-between items-center p-6 border-b">
        <h2 class="text-lg font-bold text-slate-800">Create Schedule</h2>
        <button (click)="closeSidebar()">
          <span class="material-icons">close</span>
        </button>
      </div>

      <!-- Form -->
      <div class="p-6 space-y-4">

        <!-- Day -->
        <div>
          <label class="text-xs text-slate-500 block mb-1">Day</label>
          <select class="w-full border border-slate-200 rounded-lg p-2 text-sm">
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
          </select>
        </div>

        <!-- Time -->
        <div>
          <label class="text-xs text-slate-500 block mb-1">Time</label>
          <input type="time" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
        </div>

        <!-- Status -->
        <div>
          <label class="text-xs text-slate-500 block mb-1">Status</label>
          <select class="w-full border border-slate-200 rounded-lg p-2 text-sm">
            <option>Available</option>
            <option>Booked</option>
            <option>Surgery</option>
            <option>Personal</option>
          </select>
        </div>

        <!-- Notes -->
        <div>
          <label class="text-xs text-slate-500 block mb-1">Notes</label>
          <textarea rows="3" class="w-full border border-slate-200 rounded-lg p-2 text-sm"></textarea>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-2 pt-4">
          <button (click)="closeSidebar()" class="px-4 py-2 text-sm rounded-lg bg-slate-100 hover:bg-slate-200">
            Cancel
          </button>
          <button class="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700">
            Save
          </button>
        </div>

      </div>
    </div>

  </div>
  <div *ngIf="isSidebarOpen" (click)="closeSidebar()" class="fixed inset-0 bg-black/30 z-40">
  </div>
</div>
