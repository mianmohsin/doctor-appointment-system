<div class="p-4 md:p-8 bg-slate-50 min-h-screen">

  <!-- Page Header -->
  <div class="mb-8 flex justify-between items-end">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Admin Profile</h1>
      <p class="text-slate-500 font-medium">Manage your personal identity and security settings.</p>
    </div>
    <div class="flex gap-3">
      <button *ngIf="!isEditing" (click)="toggleEdit()" class="px-5 py-2.5 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-50 transition-all shadow-sm">
        Edit Profile
      </button>
      <button *ngIf="isEditing" (click)="saveProfile()" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200">
        Save Changes
      </button>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-8">

    <!-- LEFT SIDE: Profile Summary -->
    <div class="col-span-12 lg:col-span-4 space-y-6">
      <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100 text-center relative overflow-hidden">
        <!-- Decorative Background Element -->
        <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-br from-indigo-500 to-purple-600 opacity-10"></div>

        <div class="relative mt-4 mb-6">
          <img src="https://i.pravatar.cc/150?u=alex" class="w-32 h-32 rounded-3xl mx-auto border-4 border-white shadow-xl object-cover" alt="Admin">
          <button class="absolute bottom-0 right-1/2 translate-x-12 translate-y-2 bg-white p-2 rounded-xl shadow-lg border border-slate-100 text-slate-600 hover:text-indigo-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </button>
        </div>

        <h2 class="text-2xl font-bold text-slate-800">{{adminData.firstName}} {{adminData.lastName}}</h2>
        <p class="text-indigo-600 font-bold text-sm tracking-wide uppercase mb-6">{{adminData.role}}</p>

        <div class="space-y-4 text-left">
          <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-2xl border border-slate-100">
            <div class="p-2 bg-white rounded-lg shadow-xs text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <span class="text-sm font-medium text-slate-600">{{adminData.email}}</span>
          </div>
          <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-2xl border border-slate-100">
            <div class="p-2 bg-white rounded-lg shadow-xs text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <span class="text-sm font-medium text-slate-600 italic">Joined {{adminData.joinedDate}}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: Detailed Form Panels -->
    <div class="col-span-12 lg:col-span-8">
      <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">

        <!-- Tab Navigation -->
        <div class="flex border-b border-slate-50 px-8">
          <button (click)="activeTab = 'personal'" [class.text-indigo-600]="activeTab === 'personal'" class="px-6 py-6 font-bold text-sm border-b-2 transition-all" [class.border-indigo-600]="activeTab === 'personal'" [class.border-transparent]="activeTab !== 'personal'">PERSONAL INFO</button>
          <button (click)="activeTab = 'security'" [class.text-indigo-600]="activeTab === 'security'" class="px-6 py-6 font-bold text-sm border-b-2 transition-all" [class.border-indigo-600]="activeTab === 'security'" [class.border-transparent]="activeTab !== 'security'">SECURITY</button>
        </div>

        <!-- Tab Content: Personal Info -->
        <div *ngIf="activeTab === 'personal'" class="p-10 animate-in fade-in slide-in-from-right-4 duration-300">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

            <!-- Input Field Group -->
            <div class="space-y-2">
              <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">First Name</label>
              <input type="text" [(ngModel)]="adminData.firstName" [disabled]="!isEditing"
                class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:ring-4 focus:ring-indigo-50 outline-none transition-all disabled:opacity-60 disabled:cursor-not-allowed">
            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Last Name</label>
              <input type="text" [(ngModel)]="adminData.lastName" [disabled]="!isEditing"
                class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:ring-4 focus:ring-indigo-50 outline-none transition-all disabled:opacity-60">
            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Phone Number</label>
              <input type="text" [(ngModel)]="adminData.phone" [disabled]="!isEditing"
                class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:ring-4 focus:ring-indigo-50 outline-none transition-all disabled:opacity-60">
            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Location</label>
              <input type="text" [(ngModel)]="adminData.location" [disabled]="!isEditing"
                class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:ring-4 focus:ring-indigo-50 outline-none transition-all disabled:opacity-60">
            </div>

            <div class="md:col-span-2 space-y-2">
              <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Professional Bio</label>
              <textarea [(ngModel)]="adminData.bio" [disabled]="!isEditing" rows="4"
                class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:bg-white focus:ring-4 focus:ring-indigo-50 outline-none transition-all disabled:opacity-60 resize-none"></textarea>
            </div>
          </div>
        </div>

        <!-- Tab Content: Security (Placeholder example) -->
        <div *ngIf="activeTab === 'security'" class="p-10 animate-in fade-in slide-in-from-right-4 duration-300">
           <div class="space-y-6 max-w-md">
             <div class="p-6 bg-slate-900 rounded-3xl text-white flex justify-between items-center">
               <div>
                 <h4 class="font-bold">Two-Factor Auth</h4>
                 <p class="text-xs text-slate-400">Enhance your account security.</p>
               </div>
               <div class="bg-emerald-500 text-[10px] px-2 py-1 rounded font-bold uppercase">Active</div>
             </div>

             <button class="w-full py-4 border-2 border-dashed border-slate-200 rounded-3xl text-slate-500 font-bold hover:border-indigo-500 hover:text-indigo-600 transition-all">
                Update Password
             </button>
           </div>
        </div>

      </div>
    </div>
  </div>
</div>
