
  <!-- TOP HEADER / ACTION BAR -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-30 px-8 py-4 rounded-full">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-4">
        <button class="p-2.5 hover:bg-slate-50 rounded-xl text-slate-400 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </button>
        <h1 class="text-xl font-black text-slate-900 tracking-tight">New Message</h1>
      </div>

      <div class="flex items-center gap-3">
        <span class="hidden md:block text-[10px] font-black text-slate-400 uppercase tracking-widest mr-4">Auto-saved 2m ago</span>
        <button class="px-6 py-2.5 text-slate-500 font-bold text-sm hover:text-rose-600 transition-colors">Discard</button>
        <div class="flex shadow-lg shadow-indigo-100 rounded-2xl overflow-hidden">
          <button class="px-8 py-3 bg-indigo-600 text-white font-black text-sm hover:bg-indigo-700 transition-all active:scale-95">
            Send Now
          </button>
          <button class="px-3 bg-indigo-700 text-white border-l border-indigo-500 hover:bg-indigo-800 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto mt-10 grid grid-cols-12 gap-8">

    <!-- LEFT: COMPOSER -->
    <div class="col-span-12 lg:col-span-8 space-y-6">
      <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden">

        <!-- RECIPIENTS AREA -->
        <div class="p-8 space-y-4 border-b border-slate-50">
          <div class="flex items-center gap-4 group">
            <span class="w-12 text-xs font-black text-slate-400 uppercase tracking-widest">To</span>
            <div class="flex-1 flex flex-wrap gap-2 items-center">
              <!-- Recipient Chip -->
              <div class="flex items-center gap-2 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl border border-indigo-100 group">
                <div class="w-5 h-5 bg-indigo-600 text-white rounded-full flex items-center justify-center text-[8px] font-black">AK</div>
                <span class="text-xs font-bold">ali.khan#provider.pk</span>
                <button class="hover:text-rose-500"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/></svg></button>
              </div>
              <input type="text" class="flex-1 min-w-[200px] outline-none text-sm font-medium text-slate-700" placeholder="Add recipients...">
            </div>
            <button class="text-[10px] font-black text-indigo-600 uppercase tracking-widest hover:underline">CC/BCC</button>
          </div>

          <div class="flex items-center gap-4">
            <span class="w-12 text-xs font-black text-slate-400 uppercase tracking-widest">Subject</span>
            <input type="text" placeholder="Enter message subject" class="flex-1 outline-none text-sm font-bold text-slate-900 placeholder:text-slate-300">
          </div>
        </div>

        <!-- TOOLBAR -->
        <div class="px-8 py-3 bg-slate-50/50 flex items-center gap-1 border-b border-slate-50">
          <button class="p-2 text-slate-500 hover:bg-white hover:text-indigo-600 rounded-lg transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg></button>
          <button class="p-2 text-slate-500 hover:bg-white hover:text-indigo-600 rounded-lg transition-all font-serif font-bold italic text-lg leading-none">B</button>
          <button class="p-2 text-slate-500 hover:bg-white hover:text-indigo-600 rounded-lg transition-all italic font-serif text-lg leading-none">I</button>
          <div class="w-[1px] h-6 bg-slate-200 mx-2"></div>
          <button class="p-2 text-slate-500 hover:bg-white hover:text-indigo-600 rounded-lg transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg></button>
          <button class="p-2 text-slate-500 hover:bg-white hover:text-indigo-600 rounded-lg transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></button>
        </div>

        <!-- EDITOR AREA -->
        <textarea rows="15" class="w-full p-8 text-slate-700 outline-none resize-none leading-relaxed placeholder:text-slate-300 font-medium" placeholder="Start typing your message..."></textarea>

        <!-- ATTACHMENT BAR -->
        <div class="px-8 py-6 bg-slate-50/30 border-t border-slate-50">
          <div class="flex flex-wrap gap-3">
            <div class="flex items-center gap-3 bg-white border border-slate-100 p-2 pr-4 rounded-2xl shadow-sm group hover:border-indigo-200 transition-all cursor-pointer">
              <div class="w-10 h-10 bg-rose-50 text-rose-500 rounded-xl flex items-center justify-center font-black text-[10px]">PDF</div>
              <div>
                <p class="text-xs font-black text-slate-900">Claim_Details.pdf</p>
                <p class="text-[9px] font-bold text-slate-400 uppercase">1.2 MB</p>
              </div>
              <button class="ml-2 text-slate-300 group-hover:text-rose-500"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: SMART UTILITIES -->
    <div class="col-span-12 lg:col-span-4 space-y-6">

      <!-- TEMPLATE LIBRARY -->
      <div class="bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-sm">
        <h3 class="text-lg font-black text-slate-900 mb-6 flex items-center gap-2">
          <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          Templates
        </h3>

        <div class="space-y-3">
          <button class="w-full text-left p-4 bg-slate-50 border border-transparent hover:border-indigo-100 hover:bg-indigo-50/50 rounded-2xl transition-all group">
            <p class="text-sm font-black text-slate-900 group-hover:text-indigo-600">Claim Approval</p>
            <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-tighter">Formal acceptance of liability</p>
          </button>

          <button class="w-full text-left p-4 bg-slate-50 border border-transparent hover:border-indigo-100 hover:bg-indigo-50/50 rounded-2xl transition-all group">
            <p class="text-sm font-black text-slate-900 group-hover:text-indigo-600">Additional Docs Required</p>
            <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-tighter">Request missing evidence</p>
          </button>

          <button class="w-full text-left p-4 bg-slate-50 border border-transparent hover:border-indigo-100 hover:bg-indigo-50/50 rounded-2xl transition-all group">
            <p class="text-sm font-black text-slate-900 group-hover:text-indigo-600">Policy Renewal Notice</p>
            <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-tighter">Standard renewal communication</p>
          </button>
        </div>

        <button class="w-full mt-6 py-3 border-2 border-dashed border-slate-100 text-slate-400 font-bold text-xs rounded-2xl hover:border-indigo-300 hover:text-indigo-600 transition-all">
          + Create Template
        </button>
      </div>

      <!-- SECURITY & SETTINGS -->
      <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-xl shadow-slate-200">
        <h3 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Security Settings</h3>
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-bold">End-to-End Encryption</p>
              <p class="text-[10px] text-slate-500 font-medium mt-0.5">Secure patient data transmission</p>
            </div>
            <div class="w-10 h-5 bg-indigo-600 rounded-full relative shadow-inner">
              <div class="absolute right-0.5 top-0.5 w-4 h-4 bg-white rounded-full"></div>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-bold">Self-Destruct</p>
              <p class="text-[10px] text-slate-500 font-medium mt-0.5">Link expires in 24 hours</p>
            </div>
            <div class="w-10 h-5 bg-slate-700 rounded-full relative shadow-inner">
              <div class="absolute left-0.5 top-0.5 w-4 h-4 bg-slate-500 rounded-full"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
