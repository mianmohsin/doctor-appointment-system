
  <!-- TOP HEADER / BREADCRUMBS -->
  <header class="max-w-7xl mx-auto px-6 py-10">
    <h1 class="text-4xl font-black text-slate-900 tracking-tight">Add Insurance Provider</h1>
    <p class="text-slate-500 font-medium mt-1">Onboard a new carrier into the MedCore ecosystem.</p>
  </header>

  <main class="max-w-7xl mx-auto px-6 grid grid-cols-12 gap-10 items-start">

    <!-- RIGHT: FORM FIELDS -->
    <div class="col-span-12 space-y-8">

      <!-- SECTION 1: IDENTITY -->
      <section class="bg-white rounded-[2.5rem] p-10 border border-slate-100 shadow-sm">
        <div class="flex items-center gap-4 mb-10">
          <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center font-bold">1</div>
          <h2 class="text-2xl font-black text-slate-900 tracking-tight">Brand Identity</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-[0.1em] ml-1">Company Full Name</label>
            <input type="text" placeholder="e.g. EFU General Insurance"
                   class="w-full px-6 py-4 bg-slate-50 border border-transparent rounded-2xl focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-600 outline-none transition-all font-bold text-slate-700">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-[0.1em] ml-1">Provider Type</label>
            <select class="w-full px-6 py-4 bg-slate-50 border border-transparent rounded-2xl focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-600 outline-none transition-all font-bold text-slate-700 appearance-none">
              <option>Private Limited</option>
              <option>Government / Public</option>
              <option>International</option>
            </select>
          </div>

          <div class="md:col-span-2 space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-[0.1em] ml-1">Company Logo / Brand Color</label>
            <div class="flex items-center gap-4 p-4 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50 hover:bg-indigo-50/50 hover:border-indigo-300 transition-all cursor-pointer">
              <div class="w-12 h-12 bg-white rounded-xl shadow-sm flex items-center justify-center text-slate-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-width="2"/></svg>
              </div>
              <div>
                <p class="text-sm font-bold text-slate-700">Upload Logo</p>
                <p class="text-[10px] text-slate-400 font-bold uppercase">PNG, SVG (Max 2MB)</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 2: CONNECTIVITY -->
      <section class="bg-white rounded-[2.5rem] p-10 border border-slate-100 shadow-sm">
        <div class="flex items-center gap-4 mb-10">
          <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center font-bold">2</div>
          <h2 class="text-2xl font-black text-slate-900 tracking-tight">Contact Channels</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-[0.1em] ml-1">Primary Phone</label>
            <input type="tel" placeholder="0300-0000000" class="w-full px-6 py-4 bg-slate-50 border border-transparent rounded-2xl focus:bg-white focus:border-emerald-500 outline-none transition-all font-bold">
          </div>
          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-[0.1em] ml-1">Official Email</label>
            <input type="email" placeholder="support@company.com" class="w-full px-6 py-4 bg-slate-50 border border-transparent rounded-2xl focus:bg-white focus:border-emerald-500 outline-none transition-all font-bold">
          </div>
          <div class="md:col-span-2 space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-[0.1em] ml-1">Physical Head Office Address</label>
            <textarea rows="3" placeholder="Full office address..." class="w-full px-6 py-4 bg-slate-50 border border-transparent rounded-2xl focus:bg-white focus:border-emerald-500 outline-none transition-all font-bold"></textarea>
          </div>
        </div>
      </section>

      <!-- SECTION 3: CONTRACT -->
      <section class="bg-white rounded-[2.5rem] p-10 border border-slate-100 shadow-sm">
        <div class="flex items-center gap-4 mb-10">
          <div class="w-10 h-10 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center font-bold">3</div>
          <h2 class="text-2xl font-black text-slate-900 tracking-tight">Contractual Terms</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-[0.1em] ml-1">NTN / Registration Number</label>
            <input type="text" placeholder="NTN-9982-1" class="w-full px-6 py-4 bg-slate-50 border border-transparent rounded-2xl focus:bg-white outline-none transition-all font-bold">
          </div>
          <div class="space-y-2">
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-[0.1em] ml-1">Partnership Status</label>
            <div class="flex bg-slate-50 p-1.5 rounded-2xl">
              <button class="flex-1 py-2.5 bg-white text-emerald-600 rounded-xl text-xs font-black shadow-sm">ACTIVE</button>
              <button class="flex-1 py-2.5 text-slate-400 text-xs font-black">ON HOLD</button>
            </div>
          </div>
        </div>

        <!-- FORM ACTIONS -->
        <div class="mt-12 pt-10 border-t border-slate-50 flex items-center justify-end gap-4">
          <button type="button" class="px-8 py-4 text-sm font-black text-slate-400 hover:text-rose-600 transition-colors uppercase tracking-widest">Discard</button>
          <button type="submit" class="px-10 py-4 bg-indigo-600 text-white rounded-[1.5rem] font-black shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all active:scale-95 uppercase tracking-widest text-xs">
            Save Provider & Finish
          </button>
        </div>
      </section>

    </div>
  </main>
