<div class="min-h-screen">

  <!-- Header Area -->
  <div class="flex flex-col lg:flex-row lg:items-center justify-between mb-10 gap-6">
    <div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">Billing & Invoices</h1>
      <p class="text-slate-500 font-medium mt-1">Monitor your medical practice's financial performance.</p>
    </div>
    <button [routerLink]="['/admin/invoices/add']" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3.5 rounded-2xl font-bold shadow-xl shadow-indigo-100 transition-all flex items-center gap-2 group">
      <span class="bg-white/20 p-1 rounded-lg group-hover:rotate-90 transition-transform">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
      </span>
      Create New Invoice
    </button>
  </div>

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
    <div *ngFor="let stat of stats" class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex items-center gap-5">
      <div [ngClass]="stat.bg" class="w-14 h-14 rounded-2xl flex items-center justify-center {{stat.color}}">
        <svg *ngIf="stat.icon === 'trending-up'" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
        <svg *ngIf="stat.icon === 'clock'" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <svg *ngIf="stat.icon === 'x-circle'" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">{{stat.label}}</p>
        <h3 class="text-2xl font-black text-slate-800 tracking-tight">{{stat.value}}</h3>
      </div>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="bg-white p-4 rounded-[2rem] shadow-sm border border-slate-100 mb-8 flex flex-wrap lg:flex-nowrap items-center gap-4">
    <div class="relative flex-grow">
      <svg class="w-5 h-5 absolute left-4 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" placeholder="Search by ID or Patient name..." class="w-full bg-slate-50 border-none rounded-2xl pl-12 pr-4 py-3.5 text-sm font-medium focus:ring-4 focus:ring-indigo-50 outline-none transition-all">
    </div>

    <div class="flex gap-3 w-full lg:w-auto">
      <select class="bg-slate-50 border-none rounded-2xl px-6 py-3.5 text-sm font-bold text-slate-600 outline-none focus:ring-4 focus:ring-indigo-50">
        <option>All Doctors</option>
      </select>
      <select class="bg-slate-50 border-none rounded-2xl px-6 py-3.5 text-sm font-bold text-slate-600 outline-none focus:ring-4 focus:ring-indigo-50">
        <option>Status: All</option>
      </select>
      <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3.5 rounded-2xl font-bold shadow-xl shadow-indigo-100 transition-all flex items-center gap-2 group">Export All</button>
    </div>
  </div>

  <!-- Main Table -->
  <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-slate-50/50">
          <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Invoice ID</th>
          <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Patient</th>
          <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Doctor</th>
          <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Date</th>
          <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Amount</th>
          <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Status</th>
          <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-50">
        <tr *ngFor="let inv of invoices" class="hover:bg-slate-50/50 transition-colors group">
          <td class="px-8 py-6">
            <span class="font-black text-slate-800">#{{inv.id}}</span>
          </td>
          <td class="px-8 py-6">
            <div class="flex items-center gap-3">
              <img [src]="inv.pImg" class="w-10 h-10 rounded-xl object-cover shadow-sm border-2 border-white">
              <span class="font-bold text-slate-700">{{inv.patient}}</span>
            </div>
          </td>
          <td class="px-8 py-6">
            <span class="px-3 py-1 bg-indigo-50 text-indigo-600 text-[10px] font-black rounded-lg uppercase tracking-wider">{{inv.doctor}}</span>
          </td>
          <td class="px-8 py-6 text-sm font-medium text-slate-500">{{inv.date}}</td>
          <td class="px-8 py-6 text-center">
            <span class="text-lg font-black text-indigo-600 tracking-tight">${{inv.amount}}</span>
          </td>
          <td class="px-8 py-6 text-center">
            <span [ngClass]="{
              'bg-emerald-50 text-emerald-600 border-emerald-100': inv.status === 'Paid',
              'bg-amber-50 text-amber-600 border-amber-100': inv.status === 'Pending',
              'bg-rose-50 text-rose-600 border-rose-100': inv.status === 'Cancelled'
            }" class="px-4 py-1.5 border text-[10px] font-black rounded-full uppercase flex items-center justify-center gap-1.5 w-24 mx-auto">
              <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
              {{inv.status}}
            </span>
          </td>
          <td class="px-8 py-6 text-right">
            <div class="flex justify-end gap-2">
              <button (click)="printInvoice(inv)" class="p-2 hover:bg-white rounded-lg text-slate-400 hover:text-indigo-600 shadow-sm border border-transparent hover:border-slate-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></button>
              <button class="p-2 hover:bg-white rounded-lg text-slate-400 hover:text-blue-600 shadow-sm border border-transparent hover:border-slate-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
              <button class="p-2 hover:bg-white rounded-lg text-slate-400 hover:text-rose-600 shadow-sm border border-transparent hover:border-slate-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Footer Pagination -->
    <div class="px-8 py-6 bg-slate-50/50 flex flex-col md:flex-row items-center justify-between gap-4">
      <p class="text-xs font-bold text-slate-400 tracking-wider">SHOWING 1-10 OF 50 INVOICES</p>
      <div class="flex gap-2">
        <button class="px-4 py-2 bg-white border border-slate-200 text-slate-400 text-xs font-bold rounded-xl hover:bg-slate-50 transition-all">PREV</button>
        <button class="w-10 h-10 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow-lg shadow-indigo-100">1</button>
        <button class="w-10 h-10 bg-white border border-slate-200 text-slate-500 text-xs font-bold rounded-xl hover:bg-slate-50 transition-all">2</button>
        <button class="px-4 py-2 bg-white border border-slate-200 text-slate-500 text-xs font-bold rounded-xl hover:bg-slate-50 transition-all">NEXT</button>
      </div>
    </div>
  </div>
</div>
