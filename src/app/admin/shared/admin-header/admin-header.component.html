
  <!-- TOP HEADER NAV -->
  <header class="h-20 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-50">

    <!-- Hamburger Menu (Mobile Only) -->
    <div class="flex items-center gap-4 lg:hidden">
      <button (click)="sidebarService.toggle()"
              class="p-2.5 text-slate-600 bg-slate-50 rounded-xl hover:bg-slate-100 active:scale-95 transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
        </svg>
      </button>
      <span class="font-black text-slate-800 tracking-tighter">MEDCORE</span>
    </div>

    <!-- Search Bar -->
    <div class="relative w-72 hidden md:block">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </span>
      <input type="text" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 pl-10 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Search anything...">
    </div>

    <!-- User Profile Dropdown Area -->
    <div class="flex items-center gap-4 relative">
      <!-- NOTIFICATION DROPDOWN AREA -->
    <div class="relative">
      <!-- Bell Icon Button -->
      <button (click)="toggleNotifications(); $event.stopPropagation()"
              class="relative p-2.5 text-slate-400 hover:bg-slate-50 hover:text-indigo-600 rounded-2xl transition-all group">
        <svg class="w-6 h-6 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <!-- Red Dot Badge -->
        <span class="absolute top-2.5 right-2.5 w-2.5 h-2.5 bg-rose-500 rounded-full border-2 border-white ring-1 ring-rose-200"></span>
      </button>

      <!-- NOTIFICATION PANEL -->
      <div *ngIf="isNotificationOpen"
           class="absolute right-0 mt-4 w-96 bg-white rounded-[2rem] shadow-[0px_20px_50px_rgba(0,0,0,0.15)] border border-slate-100 overflow-hidden animate-in fade-in slide-in-from-top-2 duration-200">

        <!-- Header -->
        <div class="p-6 border-b border-slate-50 flex justify-between items-center">
          <div>
            <h3 class="text-lg font-extrabold text-slate-800">Notifications</h3>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">You have 2 unread messages</p>
          </div>
          <button class="text-xs font-bold text-indigo-600 hover:underline">Mark all as read</button>
        </div>

        <!-- Notification List -->
        <div class="max-h-[400px] overflow-y-auto custom-scrollbar">
          <div *ngFor="let note of notifications"
               class="p-5 flex gap-4 hover:bg-slate-50/80 transition-all cursor-pointer relative group">

            <!-- Unread Indicator (Blue bar on left) -->
            <div *ngIf="!note.read" class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-500"></div>

            <!-- Icon Circle -->
            <div class="w-12 h-12 shrink-0 rounded-2xl flex items-center justify-center {{note.icon}}">
              <svg *ngIf="note.type === 'appointment'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <svg *ngIf="note.type === 'prescription'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              <svg *ngIf="note.type === 'system'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
              <svg *ngIf="note.type === 'patient'" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>

            <!-- Content -->
            <div class="flex-1">
              <div class="flex justify-between items-start">
                <p class="text-sm font-bold text-slate-800 leading-none group-hover:text-indigo-600 transition-colors">{{note.title}}</p>
                <span class="text-[10px] font-bold text-slate-400 whitespace-nowrap ml-2">{{note.time}}</span>
              </div>
              <p class="text-xs text-slate-500 mt-1.5 leading-relaxed font-medium">{{note.desc}}</p>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <button class="w-full py-4 bg-slate-50/50 border-t border-slate-50 text-xs font-bold text-slate-500 hover:text-indigo-600 transition-colors uppercase tracking-widest">
          View All Notifications
        </button>
      </div>
    </div>

      <!-- Profile Button -->
      <div class="relative">
        <button (click)="toggleProfile()" class="flex items-center gap-3 p-1.5 pr-3 hover:bg-slate-50 rounded-2xl transition-all border border-transparent hover:border-slate-100">
          <img src="https://i.pravatar.cc/150?u=admin" class="w-9 h-9 rounded-xl object-cover shadow-sm border border-white">
          <div class="text-left hidden sm:block">
            <p class="text-xs font-bold text-slate-800 leading-none">Alexander Thorne</p>
            <p class="text-[10px] font-bold text-indigo-600 mt-1 uppercase tracking-tighter">Medical Director</p>
          </div>
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
        </button>

        <!-- USER DROPDOWN MENU -->
        <div *ngIf="isProfileOpen" class="absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-xl border border-slate-100 p-2 dropdown-animate ring-1 ring-black/5 z-[60]">
          <div class="px-4 py-3 border-b border-slate-50 mb-1">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Account</p>
          </div>
          <a [routerLink]="['/admin/profile']" class="flex items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-xl transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            My Profile
          </a>
          <!-- <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-xl transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
            Settings
          </a> -->
          <hr class="my-1 border-slate-50">
          <button (click)="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-bold text-rose-500 hover:bg-rose-50 rounded-xl transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Log Out
          </button>
        </div>
      </div>
    </div>
  </header>
