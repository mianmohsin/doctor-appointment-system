<div class="p-6 md:p-10 bg-[#f8fafc] min-h-screen font-sans">

  <!-- Header Section -->
  <div class="flex flex-col lg:flex-row lg:items-center justify-between mb-10 gap-6">
    <div class="space-y-1">
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">System Settings</h1>
      <p class="text-slate-500 font-medium">Control global behavior for the entire Medcore ecosystem.</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="px-6 py-3 bg-white border border-slate-200 text-slate-600 rounded-2xl font-bold hover:bg-slate-50 transition-all">Discard</button>
      <button (click)="save()" class="px-8 py-3 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all flex items-center gap-2">
        Apply Global Changes
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

    <!-- COLUMN 1: DOCTOR WORKFLOW -->
    <div class="space-y-8">
      <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100">
        <div class="flex items-center gap-4 mb-8">
          <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </div>
          <h2 class="text-xl font-bold text-slate-800">Doctor Workflow</h2>
        </div>

        <div class="space-y-6">
          <!-- Toggle -->
          <div class="flex justify-between items-center group">
            <label class="cursor-pointer">
              <p class="text-sm font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">Instant Verification</p>
              <p class="text-[11px] text-slate-400">Auto-approve verified licenses.</p>
            </label>
            <input type="checkbox" [(ngModel)]="doctor.autoVerify" class="w-10 h-5 rounded-full appearance-none bg-slate-200 checked:bg-indigo-600 relative cursor-pointer transition-all before:content-[''] before:absolute before:w-4 before:h-4 before:bg-white before:rounded-full before:top-0.5 before:left-0.5 checked:before:left-5 before:transition-all">
          </div>

          <!-- Select -->
          <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Cancellation Policy</label>
            <select [(ngModel)]="doctor.cancelPolicy" class="w-full bg-slate-50 border-none rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-indigo-100 transition-all">
              <option value="none">Flexible (No limit)</option>
              <option value="24h">Standard (24h limit)</option>
              <option value="48h">Strict (48h limit)</option>
            </select>
          </div>

          <!-- Input Group -->
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
              <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Commission %</label>
              <input type="number" [(ngModel)]="doctor.commRate" class="w-full bg-slate-50 border-none rounded-xl px-4 py-3 text-sm font-bold">
            </div>
            <div class="space-y-2">
              <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Buffer (Min)</label>
              <input type="number" [(ngModel)]="doctor.slotGap" class="w-full bg-slate-50 border-none rounded-xl px-4 py-3 text-sm font-bold">
            </div>
          </div>

          <div class="pt-4 border-t border-slate-50 flex justify-between items-center">
            <span class="text-sm font-bold text-slate-700">Video Consultations</span>
            <input type="checkbox" [(ngModel)]="doctor.allowVideo" class="w-10 h-5 rounded-full appearance-none bg-slate-200 checked:bg-indigo-600 relative cursor-pointer transition-all before:content-[''] before:absolute before:w-4 before:h-4 before:bg-white before:rounded-full before:top-0.5 before:left-0.5 checked:before:left-5 before:transition-all">
          </div>
        </div>
      </div>
    </div>

    <!-- COLUMN 2: PATIENT EXPERIENCE -->
    <div class="space-y-8">
      <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100">
        <div class="flex items-center gap-4 mb-8">
          <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          </div>
          <h2 class="text-xl font-bold text-slate-800">Patient Experience</h2>
        </div>

        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <label>
              <p class="text-sm font-bold text-slate-700">Email Verification</p>
              <p class="text-[11px] text-slate-400">Required for account activation.</p>
            </label>
            <input type="checkbox" [(ngModel)]="patient.emailVerify" class="w-10 h-5 rounded-full appearance-none bg-slate-200 checked:bg-emerald-500 relative cursor-pointer transition-all before:content-[''] before:absolute before:w-4 before:h-4 before:bg-white before:rounded-full before:top-0.5 before:left-0.5 checked:before:left-5 before:transition-all">
          </div>

          <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Global Billing Currency</label>
            <div class="relative">
              <select [(ngModel)]="patient.billingCurrency" class="w-full bg-slate-50 border-none rounded-xl px-4 py-3 text-sm font-semibold appearance-none">
                <option value="USD">USD ($) - United States Dollar</option>
                <option value="EUR">EUR (€) - Euro</option>
                <option value="GBP">GBP (£) - British Pound</option>
              </select>
              <div class="absolute right-4 top-3.5 pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"></path></svg>
              </div>
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Data Privacy Mode</label>
            <div class="flex gap-2">
                <button (click)="patient.privacyLevel = 'Standard'" [class.bg-indigo-600]="patient.privacyLevel === 'Standard'" [class.text-white]="patient.privacyLevel === 'Standard'" class="flex-1 py-2 text-[11px] font-bold rounded-lg border border-slate-100 bg-slate-50 text-slate-500 transition-all">Standard</button>
                <button (click)="patient.privacyLevel = 'Strict'" [class.bg-indigo-600]="patient.privacyLevel === 'Strict'" [class.text-white]="patient.privacyLevel === 'Strict'" class="flex-1 py-2 text-[11px] font-bold rounded-lg border border-slate-100 bg-slate-50 text-slate-500 transition-all">Strict (HIPAA)</button>
            </div>
          </div>

          <div class="pt-4 border-t border-slate-50 space-y-4">
            <div class="flex justify-between items-center">
                <span class="text-sm font-bold text-slate-700">SMS Notifications</span>
                <input type="checkbox" [(ngModel)]="patient.smsAlerts" class="w-10 h-5 rounded-full appearance-none bg-slate-200 checked:bg-emerald-500 relative cursor-pointer transition-all before:content-[''] before:absolute before:w-4 before:h-4 before:bg-white before:rounded-full before:top-0.5 before:left-0.5 checked:before:left-5 before:transition-all">
            </div>
            <div class="flex justify-between items-center">
                <span class="text-sm font-bold text-slate-700">In-App Direct Chat</span>
                <input type="checkbox" [(ngModel)]="patient.allowChat" class="w-10 h-5 rounded-full appearance-none bg-slate-200 checked:bg-emerald-500 relative cursor-pointer transition-all before:content-[''] before:absolute before:w-4 before:h-4 before:bg-white before:rounded-full before:top-0.5 before:left-0.5 checked:before:left-5 before:transition-all">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- COLUMN 3: GLOBAL SYSTEM -->
    <div class="space-y-8">
      <div class="bg-indigo-900 rounded-[2.5rem] p-8 shadow-xl text-white">
        <div class="flex items-center gap-4 mb-8">
          <div class="w-12 h-12 bg-white/10 text-indigo-200 rounded-2xl flex items-center justify-center backdrop-blur-md">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
          </div>
          <h2 class="text-xl font-bold">Global Overrides</h2>
        </div>

        <div class="space-y-6">
            <div class="p-4 bg-white/5 rounded-2xl border border-white/10 flex justify-between items-center">
                <label>
                    <p class="text-sm font-bold">Maintenance Mode</p>
                    <p class="text-[10px] text-indigo-300">Disable platform for all users.</p>
                </label>
                <input type="checkbox" [(ngModel)]="system.maintenanceMode" class="w-10 h-5 rounded-full appearance-none bg-indigo-800 checked:bg-amber-400 relative cursor-pointer transition-all before:content-[''] before:absolute before:w-4 before:h-4 before:bg-white before:rounded-full before:top-0.5 before:left-0.5 checked:before:left-5 before:transition-all">
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black text-indigo-300 uppercase tracking-widest">Audit Log Retention (Days)</label>
                <input type="range" [(ngModel)]="system.auditRetention" min="30" max="730" class="w-full h-1.5 bg-indigo-800 rounded-lg appearance-none cursor-pointer accent-white">
                <div class="flex justify-between text-[10px] font-bold text-indigo-300">
                    <span>30d</span>
                    <span class="text-white text-xs">{{system.auditRetention}} Days</span>
                    <span>2y</span>
                </div>
            </div>

            <button class="w-full py-4 bg-white text-indigo-900 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-indigo-50 transition-all">
                Export System Database
            </button>
        </div>
      </div>

      <!-- Security Mini-Card -->
      <div class="bg-white rounded-[2rem] p-6 border border-slate-100 flex items-center justify-between">
          <div class="flex items-center gap-3">
              <div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
              </div>
              <div>
                  <p class="text-sm font-bold text-slate-700">SSL Encryption</p>
                  <p class="text-[10px] text-emerald-500 font-bold uppercase">Active & Secure</p>
              </div>
          </div>
          <button class="p-2 text-slate-400 hover:text-indigo-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
      </div>
    </div>

  </div>
</div>
