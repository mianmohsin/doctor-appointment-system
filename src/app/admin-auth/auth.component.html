<div class="min-h-screen bg-slate-950 flex items-center justify-center p-6 relative overflow-hidden font-sans">

  <!-- SECURITY BACKGROUND PATTERN -->
  <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
  </div>
  <div class="absolute top-[-20%] right-[-10%] w-[600px] h-[600px] bg-indigo-600/20 rounded-full blur-[150px]"></div>
  <div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-blue-600/10 rounded-full blur-[120px]"></div>

  <!-- ADMIN LOGIN BOX -->
  <div class="relative w-full max-w-md animate-in fade-in zoom-in-95 duration-500">

    <!-- BRANDING TOP -->
    <div class="text-center mb-10">
      <div
        class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-indigo-600 to-indigo-400 rounded-2xl shadow-2xl shadow-indigo-500/20 mb-6">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
          </path>
        </svg>
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight uppercase">Medcore Central</h1>
      <p class="text-slate-500 text-xs font-bold tracking-[0.3em] mt-2 uppercase">Administrative Portal</p>
    </div>

    <!-- MAIN FORM CARD -->
    <div class="bg-slate-900/50 backdrop-blur-xl border border-white/5 rounded-[2.5rem] p-10 shadow-2xl">

      <form (submit)="onAdminLogin()" class="space-y-6">

        <!-- Employee ID -->
        <div class="space-y-2">
          <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Username</label>
          <div class="relative group">
            <svg
              class="w-5 h-5 absolute left-4 top-4 text-slate-600 group-focus-within:text-indigo-400 transition-colors"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
            </svg>
            <input type="text" [(ngModel)]="adminData.employeeId" name="empId" placeholder="ADM-0000"
              class="w-full bg-slate-800/50 border border-white/5 rounded-2xl pl-12 pr-6 py-4 font-bold text-white outline-none focus:bg-slate-800 focus:border-indigo-500/50 transition-all placeholder:text-slate-700">
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Password</label>
          <div class="relative group">
            <svg
              class="w-5 h-5 absolute left-4 top-4 text-slate-600 group-focus-within:text-indigo-400 transition-colors"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z">
              </path>
            </svg>
            <input type="password" [(ngModel)]="adminData.password" name="adminPass" placeholder="••••••••"
              class="w-full bg-slate-800/50 border border-white/5 rounded-2xl pl-12 pr-6 py-4 font-bold text-white outline-none focus:bg-slate-800 focus:border-indigo-500/50 transition-all placeholder:text-slate-700">
          </div>
        </div>

        <!-- Security Notice -->
        <div class="flex items-center gap-3 p-4 bg-indigo-500/5 rounded-2xl border border-indigo-500/10">
          <div class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></div>
          <p class="text-[10px] font-bold text-indigo-300 leading-tight">IP logging and security audit session is active
            for this terminal.</p>
        </div>

        <!-- Login Button -->
        <button type="submit" [disabled]="isLoading"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-xl shadow-indigo-600/20 transition-all active:scale-[0.98] flex items-center justify-center gap-3 group">
          <span *ngIf="!isLoading">Access Secure Shell</span>
          <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          <svg *ngIf="!isLoading" class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
